# ==============================================================================
# nginx.conf - Demo Reverse Proxy
# ==============================================================================
# Description: Serves the frontend and the API from one origin, which the
#              frontend expects, including the progress WebSocket
# Author: Matt Barham
# Created: 2026-11-26
# Modified: 2026-11-26
# Version: 1.0.0
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 500m;

    location /api/ {
        proxy_pass http://api:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
