# ==============================================================================
# docker-compose.yml - GeneGnome Genetics Data Processing Stack
# ==============================================================================
# Description: Secure genetic data processing service with defense-in-depth
# Author: Matt Barham
# Created: 2025-10-31
# Modified: 2026-02-14
# Version: 1.4.0
# Repository: https://github.com/captainzonks/GeneGnome
# ==============================================================================
#
# Security Architecture:
#   - Isolated network (no internet access for processor)
#   - Encrypted volumes (LUKS AES-256)
#   - Row-level database security
#   - Container hardening (read-only root, seccomp, AppArmor)
#   - Comprehensive audit logging
#   - Automatic data deletion (24-hour retention)
#
# Container Versions:
#   - genetics-frontend: Nginx static file server with VCF generator
#   - genetics-api-gateway: Custom Rust/Axum application
#   - genetics-worker: Custom Rust background processor
#   - postgres18-genetics: Custom PostgreSQL 18 (user mapping)
#   - genetics-redis: Alpine-based Redis cache
#
# Documentation:
#   - Security Architecture: /docs/genetic_data_security_architecture.md
#   - API Documentation: TBD
#   - User Guide: TBD
#
# Networks:
#   - proxy: External network for reverse proxy routing (configurable)
#   - genetics_isolated: Internal-only processing network (no external access)
#   - genetics_db_network: Database network
#
# Volumes:
#   - genetics_encrypted: LUKS-encrypted data storage
#   - genetics_redis_data: Redis cache
#
# Dependencies:
#   - Reverse proxy (Traefik, nginx, Caddy, etc.) for TLS termination
#   - Authentication provider (Authentik, Authelia, etc.) - optional
#   - PostgreSQL (metadata storage) - included in this stack
#   - Redis (job queue, rate limiting) - included in this stack
#
# External Integrations:
#   - [x] Reverse proxy forward auth middleware configured
#   - [ ] DNS records configured for your domain
#   - [x] LUKS encrypted volume mounted
#   - [ ] Monitoring configured (Prometheus/Grafana) - optional
#
# ==============================================================================

name: genetics

# ==============================================================================
# EXTENSIONS
# ==============================================================================

x-ssl: &ssl
  environment:
    - SSL_CERT_FILE=${SSL_CERT_FILE}
    - REQUESTS_CA_BUNDLE=${REQUESTS_CA_BUNDLE}
    - CURL_CA_BUNDLE=${CURL_CA_BUNDLE}

  volumes:
    - ${CA_CERT}:/etc/ssl/certs/ca-certificates.crt:ro

x-logging-important: &log
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"

x-logging-small: &log_small
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

# ==============================================================================
# NETWORKS
# ==============================================================================

networks:
  # External network for reverse proxy routing
  # Change PROXY_NETWORK to match your existing proxy network name
  # (e.g., 'traefik', 'nginx-proxy', 'web')
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}

  # Isolated network for genetics processor (NO external access)
  genetics_isolated:
    name: genetics_isolated
    driver: bridge
    internal: true  # Cannot reach external networks
    ipam:
      config:
        - subnet: 172.30.0.0/24

  # Database network (internal only)
  genetics_db_network:
    name: genetics_db_network
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.2.0/24

# ==============================================================================
# VOLUMES
# ==============================================================================

volumes:
  genetics_postgres_data:
    driver: local
  genetics_redis_data:
    driver: local

# ==============================================================================
# SECRETS
# ==============================================================================

secrets:
  genetics_db_password:
    file: ${SECRETS_DIR}/genetics/genetics_psql_password
  genetics_api_key:
    file: ${SECRETS_DIR}/genetics/genetics_api_key
  genetics_jwt_secret:
    file: ${SECRETS_DIR}/genetics/genetics_jwt_secret
  smtp_password:
    file: ${SECRETS_DIR}/smtp/smtp_password

# ==============================================================================
# SERVICES
# ==============================================================================

services:
  #==============================================================================
  # POSTGRES18-GENETICS - PostgreSQL 18
  #==============================================================================
  # Metadata storage for genetics processing pipeline
  # - Job tracking and status
  # - File metadata and checksums
  # - Audit logs (append-only, row-level security)
  # - Custom build with host UID/GID mapping
  postgres18-genetics:
    <<: [*ssl, *log]
    image: ${IMAGE_PREFIX}/postgres:${POSTGRES18_GENETICS_VERSION}
    build:
      context: ./dockerfiles/postgres18/
      dockerfile: Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE}
        CT_TAG: ${POSTGRES18_GENETICS_VERSION}
        USER_ID: ${PUID}
        GROUP_ID: ${DGID}
        USERNAME: postgres
        GROUPNAME: postgres
        OG_UID: 999
        OG_GID: 999
      x-bake:
        tags:
          - postgres18-genetics:${POSTGRES18_GENETICS_VERSION}
        cache-from:
          - ${USERNAME}/postgres18-genetics:cache
          - type=local,src=./build/cache/
        cache-to:
          - type=local,dest=./build/cache/

    container_name: postgres18-genetics
    hostname: postgres18-genetics
    restart: unless-stopped
    profiles: ["genetics", "all"]

    # Security hardening
    security_opt:
      - no-new-privileges:true
    mem_limit: 2G
    cpus: 2.0
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - FOWNER
    user: 1000:968

    networks:
      genetics_db_network:
      proxy:
        ipv4_address: ${POSTGRES18_GENETICS_IP}

    ports:
      - ${POSTGRES18_GENETICS_PORT}:5432

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s

    environment:
      - TZ=${TZ}
      - DOMAIN=${DOMAIN}
      - POSTGRES_IP=${POSTGRES18_GENETICS_IP}
      - POSTGRES_PORT=${POSTGRES18_GENETICS_PORT}
      - POSTGRES_DB=${POSTGRES18_GENETICS_DB}
      - POSTGRES_USER=${POSTGRES18_GENETICS_USER}
      - POSTGRES_PASSWORD_FILE=/run/secrets/genetics_db_password

    volumes:
      - ${GENETICS_ENCRYPTED_DIR}/postgres18-genetics/tablespaces/:/data/tablespaces/:rw
      - ${GENETICS_ENCRYPTED_DIR}/postgres18-genetics/:/var/lib/postgresql/:rw
      - ${LOCALTIME}:/etc/localtime:ro
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    tmpfs:
      - /tmp/:rw,size=500m
      - /dev/shm/:rw,size=1g

    secrets:
      - genetics_db_password

  # ==============================================================================
  # REDIS CACHE/QUEUE
  # ==============================================================================
  genetics-redis:
    <<: [*ssl, *log]
    image: redis:${REDIS_VERSION}
    container_name: genetics-redis
    hostname: genetics-redis

    restart: unless-stopped
    profiles: ["genetics", "all"]

    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

    networks:
      genetics_isolated:
      proxy:

    ports:
      - ${GENETICS_REDIS_PORT}:6379

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "no"
      - --save
      - ""
      - --stop-writes-on-bgsave-error
      - "no"  # Don't block writes if RDB save fails

    volumes:
      - genetics_redis_data:/data

  # ==============================================================================
  # API GATEWAY (Axum web server)
  # ==============================================================================
  genetics-api-gateway:
    <<: [*ssl, *log]
    image: ${IMAGE_PREFIX}/genetics-api-gateway:${GENETICS_API_VERSION}
    build:
      context: ./
      dockerfile: api-gateway/Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE}
      x-bake:
        tags:
          - genetics-api-gateway:${GENETICS_API_VERSION}
        cache-from:
          - ${USERNAME}/genetics-api-gateway:cache
          - type=local,src=./build/cache/
        cache-to:
          - type=local,dest=./build/cache/

    container_name: genetics-api-gateway
    hostname: genetics-api-gateway

    restart: unless-stopped
    profiles: ["genetics", "all"]

    # Run as dedicated non-root user
    user: "3000:3000"

    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'

    # Networks
    networks:
      proxy:
        ipv4_address: ${GENETICS_API_IP}
      genetics_db_network:
      genetics_isolated:

    # Port exposure
    ports:
      - ${GENETICS_API_EXTERNAL_PORT}:${GENETICS_API_PORT}

    # Dependencies
    depends_on:
      postgres18-genetics:
        condition: service_healthy
      genetics-redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/api/genetics/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s

    # Environment
    environment:
      - RUST_LOG=${GENETICS_LOG_LEVEL:-info}
      - DATABASE_URL=postgresql://${POSTGRES18_GENETICS_USER}:${POSTGRES_GENETICS_PASSWORD}@postgres18-genetics:5432/${POSTGRES18_GENETICS_DB}
      - REDIS_URL=redis://genetics-redis:${REDIS_PORT:-6379}
      - ENCRYPTED_VOLUME_PATH=${GENETICS_ENCRYPTED_DIR}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD_FILE=/run/secrets/smtp_password
      - SMTP_USE_TLS=${SMTP_USE_TLS}
      - SMTP_USE_SSL=${SMTP_USE_SSL}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
      - GENETICS_DOWNLOAD_BASE_URL=${GENETICS_DOWNLOAD_BASE_URL}
      - GENETICS_EMAIL_TEMPLATE_DIR=${GENETICS_EMAIL_TEMPLATE_DIR}

    # Volumes
    volumes:
      - ${GENETICS_ENCRYPTED_DIR}:${GENETICS_ENCRYPTED_DIR}:rw
      - ./templates:/app/templates:ro

    # Secrets
    secrets:
      - genetics_db_password
      - genetics_api_key
      - smtp_password

  # ==============================================================================
  # GENETICS WORKER (Background job processor)
  # ==============================================================================
  genetics-worker:
    <<: [*ssl, *log]
    image: ${IMAGE_PREFIX}/genetics-worker:${GENETICS_WORKER_VERSION}
    build:
      context: ./
      dockerfile: worker/Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE}
      x-bake:
        tags:
          - genetics-worker:${GENETICS_WORKER_VERSION}
        cache-from:
          - ${USERNAME}/genetics-worker:cache
          - type=local,src=./build/cache/
        cache-to:
          - type=local,dest=./build/cache/

    container_name: genetics-worker
    hostname: genetics-worker
    restart: unless-stopped
    profiles: ["genetics", "all"]

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "3000:3000"
    group_add:
      - "968"  # docker group for accessing secrets

    # Resource limits (increased for multi-sample processing: 5.9M variants x 51 samples)
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: '4.0'
        reservations:
          memory: 10G
          cpus: '2.0'

    # Networks (proxy network for SMTP access if using external mail bridge)
    networks:
      - genetics_isolated
      - genetics_db_network
      - proxy

    depends_on:
      postgres18-genetics:
        condition: service_healthy
      genetics-redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "pgrep", "-x", "genetics-worker"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    environment:
      - RUST_LOG=${GENETICS_LOG_LEVEL:-info}
      - DATABASE_URL=postgresql://${POSTGRES18_GENETICS_USER}:${POSTGRES_GENETICS_PASSWORD}@postgres18-genetics:5432/${POSTGRES18_GENETICS_DB}
      - REDIS_URL=redis://genetics-redis:${REDIS_PORT:-6379}
      - ENCRYPTED_VOLUME_PATH=${GENETICS_ENCRYPTED_DIR}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD_FILE=/run/secrets/smtp_password
      - SMTP_USE_TLS=${SMTP_USE_TLS}
      - SMTP_USE_SSL=${SMTP_USE_SSL}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
      - GENETICS_DOWNLOAD_BASE_URL=${GENETICS_DOWNLOAD_BASE_URL}
      - GENETICS_EMAIL_TEMPLATE_DIR=${GENETICS_EMAIL_TEMPLATE_DIR}

    volumes:
      - ${GENETICS_ENCRYPTED_DIR}:${GENETICS_ENCRYPTED_DIR}:rw
      - ./templates:/app/templates:ro

    secrets:
      - genetics_db_password
      - smtp_password

  # ==============================================================================
  # GENETICS FRONTEND - Job Submission UI
  # ==============================================================================
  genetics-frontend:
    <<: [*ssl, *log_small]
    image: ${IMAGE_PREFIX}/genetics-frontend:${GENETICS_FRONTEND_VERSION}
    build:
      context: ./frontend/
      dockerfile: Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE}
        USER_ID: 3000
        GROUP_ID: 3000
      x-bake:
        tags:
          - genetics-frontend:${GENETICS_FRONTEND_VERSION}
        cache-from:
          - ${USERNAME}/genetics-frontend:cache
          - type=local,src=./build/cache/
        cache-to:
          - type=local,dest=./build/cache/
    container_name: genetics-frontend
    hostname: genetics-frontend
    restart: unless-stopped
    profiles: ["genetics", "all"]

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "3000:3000"

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

    networks:
      proxy:
        ipv4_address: ${GENETICS_FRONTEND_IP}

    expose:
      - 80

    depends_on:
      genetics-api-gateway:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    environment:
      - TZ=${TZ}

    volumes:
      - ${LOCALTIME}:/etc/localtime:ro

    tmpfs:
      - /tmp:rw,size=10m
      - /run:rw,size=5m

# ==============================================================================
# SETUP NOTES
# ==============================================================================
#
# PREREQUISITES:
#   1. Create encrypted volume: ${GENETICS_ENCRYPTED_DIR} (LUKS2 AES-256-XTS recommended)
#   2. Generate secrets in ${SECRETS_DIR}/genetics/:
#       - genetics_psql_password
#       - genetics_api_key
#       - genetics_jwt_secret
#   3. Generate SMTP secret in ${SECRETS_DIR}/smtp/:
#       - smtp_password
#   4. Create system user: genetics (UID/GID 3000)
#   5. Configure reverse proxy (Traefik, nginx, etc.) with routes to this stack
#   6. Set up authentication if desired (Authentik, Authelia, etc.)
#
# DEPLOYMENT CHECKLIST:
#   [ ] Encrypted volume mounted at ${GENETICS_ENCRYPTED_DIR}
#   [ ] PostgreSQL running with initialized schema
#   [ ] Redis running
#   [ ] API Gateway image built
#   [ ] Worker image built
#   [ ] Frontend image built
#   [ ] Reverse proxy configured with routes
#   [ ] DNS records configured
#   [ ] SMTP configured for email notifications
#   [ ] Reference panel downloaded (VCF.Files3.RData)
#   [ ] Monitoring configured (Prometheus/Grafana - optional)
#   [ ] Security audit completed
#
# ==============================================================================
