# ==============================================================================
# ci.yml - Continuous integration for GeneGnome
# ==============================================================================
# Description: Format, lint and test each crate, run the row-level security
#              integration test against a real Postgres, and build the three
#              application images. Publishes and deploys nothing.
# Author: Matt Barham
# Created: 2026-11-25
# Modified: 2026-11-25
# Version: 1.0.0
# ==============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches rust-version in each Cargo.toml and the Dockerfile builder image.
  RUSTUP_TOOLCHAIN: "1.100.0"
  CARGO_TERM_COLOR: always

jobs:
  crate:
    name: fmt + clippy + test (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate: [app, api-gateway, worker]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install "${RUSTUP_TOOLCHAIN}" --profile minimal --component clippy,rustfmt

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.crate }}/target
          key: ${{ runner.os }}-${{ matrix.crate }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.crate)) }}

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked

  rls:
    name: row-level security (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install "${RUSTUP_TOOLCHAIN}" --profile minimal

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            api-gateway/target
          key: ${{ runner.os }}-rls-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('api-gateway/Cargo.lock') }}

      - name: Run RLS integration test
        run: scripts/ci_rls_test.sh

  images:
    name: docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api-gateway
            context: .
          - image: worker
            context: .
          - image: frontend
            context: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        env:
          IMAGE: ${{ matrix.image }}
          CONTEXT: ${{ matrix.context }}
        run: docker build -f "${IMAGE}/Dockerfile" -t "genegnome-${IMAGE}:ci" "${CONTEXT}"
