# ==============================================================================
# ci.yml - Continuous integration for GeneGnome
# ==============================================================================
# Description: Format, lint and test each crate, check dependency advisories,
#              run the row-level security test against a real Postgres and the
#              queue and attempt limiter tests against a real Redis, run the demo
#              end to end, and build the three application images. Publishes and
#              deploys nothing.
# Author: Matt Barham
# Created: 2026-11-25
# Modified: 2026-11-26
# Version: 1.2.0
# ==============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches rust-version in each Cargo.toml and the Dockerfile builder image.
  RUSTUP_TOOLCHAIN: "1.100.0"
  CARGO_TERM_COLOR: always

jobs:
  crate:
    name: fmt + clippy + test (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate: [app, api-gateway, worker]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install "${RUSTUP_TOOLCHAIN}" --profile minimal --component clippy,rustfmt

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.crate }}/target
          key: ${{ runner.os }}-${{ matrix.crate }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.crate)) }}

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked

  rls:
    name: row-level security (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install "${RUSTUP_TOOLCHAIN}" --profile minimal

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            api-gateway/target
          key: ${{ runner.os }}-rls-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('api-gateway/Cargo.lock') }}

      - name: Run RLS integration test
        run: scripts/ci_rls_test.sh

  queue:
    name: worker queue (Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:8.12.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install "${RUSTUP_TOOLCHAIN}" --profile minimal

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            worker/target
            api-gateway/target
          key: ${{ runner.os }}-queue-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('worker/Cargo.lock', 'api-gateway/Cargo.lock') }}

      - name: Run queue test
        working-directory: worker
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379
        run: |
          set -euo pipefail
          cargo test --locked dequeue_on_empty -- --nocapture 2>&1 | tee "${RUNNER_TEMP}/queue.log"
          # A skipped or filtered-out test must not count as a pass.
          grep -q '1 passed' "${RUNNER_TEMP}/queue.log"
          ! grep -q 'SKIPPED' "${RUNNER_TEMP}/queue.log"

      - name: Run attempt limiter test
        working-directory: api-gateway
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379
        run: |
          set -euo pipefail
          cargo test --locked attempts_are_capped -- --nocapture 2>&1 | tee "${RUNNER_TEMP}/attempts.log"
          grep -q '1 passed' "${RUNNER_TEMP}/attempts.log"
          ! grep -q 'SKIPPED' "${RUNNER_TEMP}/attempts.log"

  advisories:
    name: cargo-deny (advisories, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_DENY_VERSION: "0.20.2"
      # SHA-256 of cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
      CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install "${RUSTUP_TOOLCHAIN}" --profile minimal

      - name: Install cargo-deny (checksum-verified release binary)
        run: |
          set -euo pipefail
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o "${RUNNER_TEMP}/${name}.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  ${RUNNER_TEMP}/${name}.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${name}.tar.gz" -C "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/${name}/cargo-deny" "${HOME}/.cargo/bin/cargo-deny"

      - name: cargo deny check
        run: |
          set -euo pipefail
          for crate in app api-gateway worker; do
            cargo deny --manifest-path "${crate}/Cargo.toml" --locked --config deny.toml \
              check advisories sources
          done

  demo:
    name: demo end to end (synthetic data)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run one synthetic job through the demo stack
        run: scripts/run_demo.sh test

  images:
    name: docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api-gateway
            context: .
          - image: worker
            context: .
          - image: frontend
            context: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        env:
          IMAGE: ${{ matrix.image }}
          CONTEXT: ${{ matrix.context }}
        run: docker build -f "${IMAGE}/Dockerfile" -t "genegnome-${IMAGE}:ci" "${CONTEXT}"
